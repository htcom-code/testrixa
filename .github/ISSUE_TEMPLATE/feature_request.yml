name: Feature request
description: Suggest a capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: a few things are **deliberately** absent, with reasons.
        Proposing them is still welcome — but say why the reason no longer
        holds, rather than only what you want.

        | Not here | Why |
        |---|---|
        | A race detector | ThreadSanitizer already does it properly. `<testrixa/thread.h>` is the harness you run under it. |
        | Replacing ASan/UBSan | The memory suite catches leaks, double frees, redzone overflow and writes to quarantined memory. Stack overflows and uninitialised reads are theirs. |
        | Parallel test execution | The whole suite runs in under a second. It would be complexity with nothing to buy. |
        | Mocking non-virtual members | Needs code generation. |
        | Mocking free functions with no seam | Needs linker substitution, which couples the library to your build. |
        | Mock call-ordering expectations | Outside the verify-after model. |

        Coverage, profiling, allocation histograms, lifetime checking and
        Windows support are **planned but unwritten** — see
        [ROADMAP.md](../blob/main/ROADMAP.md). An issue that says what you would
        use them for is more useful than one that asks when.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out about your code that testrixa cannot tell you today? Describe the situation, not the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you have a shape in mind, sketch it — the macro or the API as you would want to write it in a test.
      render: cpp
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Which part
      multiple: true
      options:
        - Unit test / assertions
        - Benchmark (measure phase)
        - Memory and leak checking
        - Mock
        - Stress (repetition)
        - Thread harness
        - Fixture (setUp / tearDown)
        - Reporter (console table, JUnit XML)
        - Runner (CLI, phase selection, options)
        - Build / install (make, CMake, find_package)
        - Something new
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, or the other tool you reach for. This is often the most useful part of the report — it shows where the seam actually is.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this would have to keep
      description: testrixa's promises to a consumer. Anything added has to hold them.
      options:
        - label: Header-only, no dependencies beyond the standard library
        - label: Nothing new in the consumer's global namespace
        - label: Every macro also available under its `TRX_` name
        - label: The report says plainly what it does not cover
    validations:
      required: false
